name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: router0
          POSTGRES_PASSWORD: router0
          POSTGRES_DB: router0_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U router0 -d router0_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GO111MODULE: "on"
      DATABASE_URL: postgres://router0:router0@127.0.0.1:5432/router0_test?sslmode=disable
      AES_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      JWT_SECRET: router0-ci-jwt-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go vet -tags 'integration smoke' ./internal/integration/...
      - name: Apply migrations (DB-backed unit tests need a migrated database)
        run: go run ./cmd/migrate
      - run: go test ./internal/... -count=1
      - name: Integration tests (mock providers, real Postgres)
        run: go test -tags integration ./internal/integration/... -run 'TestPhase1|TestPhase2' -count=1 -v
      - name: Repo checks
        run: |
          ! grep -q 'go-redis' go.mod
          ! grep -rIqi 'zer0' dashboard/app dashboard/components

  dashboard:
    name: Dashboard type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
        env:
          ROUTER_BASE_URL: http://localhost:8080

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: false
          build-args: ROUTER_BASE_URL=https://gateway.example.invalid
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
