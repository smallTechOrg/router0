groups:
  - name: zer0_router
    rules:
      - alert: HighProviderErrorRate
        expr: rate(zer0_provider_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High provider error rate for {{ $labels.provider }}/{{ $labels.model }}"
          description: "Error rate {{ $value }} errors/sec over 5m"

      - alert: AllProvidersDown
        expr: sum(zer0_requests_total{status="success"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No successful requests in 5 minutes"
          description: "Zer0 Router is not successfully routing any requests"

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, rate(zer0_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency for {{ $labels.provider }}/{{ $labels.model }}"
          description: "p95 latency is {{ $value }}s"
