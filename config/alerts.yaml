groups:
  - name: router0
    rules:
      - alert: HighRequestErrorRatio
        expr: |
          sum(rate(router0_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(router0_requests_total[5m])), 1e-9) > 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 15% of inference requests are failing"
          description: "Error ratio is {{ $value | humanizePercentage }} over 5m"

      - alert: ProviderKeysOutOfCredits
        expr: increase(router0_key_state_marks_total{reason="credits_exhausted"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Provider keys are running out of credits ({{ $labels.provider }})"
          description: "{{ $value }} credits_exhausted marks in the last 15m"

      - alert: RequestLogDropping
        expr: increase(router0_metadata_dropped_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Request-log records are being dropped"
          description: "The async metadata buffer is full; check PostgreSQL write latency"

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le, provider) (rate(router0_request_duration_seconds_bucket{stream="false"}[5m]))) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency for {{ $labels.provider }}"
          description: "p95 latency is {{ $value }}s"

      - alert: KeysSkippedForBudget
        expr: increase(router0_key_skips_total{reason="budget_exhausted"}[15m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Requests are skipping {{ $labels.provider }} keys that reached their monthly budget"
          description: "{{ $value }} budget skips in the last 15m; raise the budget or add keys if this is unexpected"

      - alert: BalancePollFailing
        expr: increase(router0_balance_polls_total{result="error"}[30m]) > 0 and increase(router0_balance_polls_total{result!="error"}[30m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Every {{ $labels.provider }} balance poll is failing"
          description: "No successful balance poll in 30m; out-of-credit keys are only detected when a request fails"

      - alert: SpendReconcileFailing
        expr: increase(router0_spend_reconcile_total{status="error"}[3h]) > 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Month-to-date spend reconciliation keeps failing"
          description: "Budget counters are not being repaired from the request log; check PostgreSQL"
